name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust, frontend, and desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
          sudo apt-get install -y bubblewrap

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sessionbridge-ci

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile Rust tests
        run: cargo test --workspace --no-run

      - name: Run Rust tests
        run: timeout 60s cargo test --workspace

      - name: Build CLI and exercise native protocol fixtures
        run: |
          cargo build --bin sessionbridge
          timeout 60s python3 tests/bridge_runtime.py target/debug/sessionbridge

      - name: Install browser test tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Exercise workgroup UI with the real backend
        run: |
          npm --prefix gui run dev > /tmp/sessionbridge-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:1420 > /dev/null && break
            sleep 1
          done
          timeout 60s python3 tests/bridge_ui.py target/debug/sessionbridge

      - name: Run frontend tests
        working-directory: gui
        run: npm test

      - name: Build frontend
        working-directory: gui
        run: npm run build

      - name: Build local Tauri release binary
        working-directory: gui
        run: npm run tauri build -- --no-bundle
