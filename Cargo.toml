[package]
name = "sessionbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first coordination CLI for autonomous coding agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/GTJasonMK/sessionBridge"
repository = "https://github.com/GTJasonMK/sessionBridge"
documentation = "https://docs.rs/sessionbridge"
keywords = ["agents", "coordination", "cli", "automation", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/docs/protocol.md",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
fs4 = "1.1"
getrandom = "0.4"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tempfile = "3.20"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.7"
shlex = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = [".", "gui/src-tauri"]
default-members = ["."]
resolver = "2"
