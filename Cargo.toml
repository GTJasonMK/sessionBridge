[package]
name = "sessionbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first coordination CLI for autonomous coding agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/GTJasonMK/sessionBridge"
repository = "https://github.com/GTJasonMK/sessionBridge"
documentation = "https://docs.rs/sessionbridge"
keywords = ["agents", "coordination", "cli", "automation", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/docs/protocol.md",
    "/skills/**",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
getrandom = "0.4"
libc = "0.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
time = "0.3"
toml = "1.1"
uuid = { version = "1.18", features = ["v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = [".", "gui/src-tauri"]
default-members = ["."]
resolver = "2"
