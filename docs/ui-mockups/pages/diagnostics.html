<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SessionBridge · 诊断</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/atoms.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/polish.css" />
  <style>
    body { margin: 0; padding: 20px 16px 48px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../js/mock-data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    const collab = SB_MOCK.collaboration;
    const doctor = SB_MOCK.doctor;
    const logs = SB_MOCK.logs;
    const ws = SB_MOCK.workspace;
    const ico = SB_SHELL.ico;

    function diagRows(items) {
      return items.map((item) => {
        const cls = item.status === "pass" ? "pass" : item.status === "fail" ? "fail" : "";
        const mark = item.status === "pass" ? "✓" : "!";
        return `<div class="diagnostic-row">
          <span class="diagnostic-icon ${cls}">${mark}</span>
          <span><strong>${item.code}</strong><small>${SB_SHELL.escapeHtml(item.message)}</small></span>
        </div>`;
      }).join("");
    }

    const logRows = logs.entries.map((entry) => `
      <div>
        <time>${entry.record.timestamp || ""}</time>
        <code>${SB_SHELL.escapeHtml(entry.record.event || entry.record.message || "")}</code>
      </div>`).join("");

    const content = `
      <div class="stack">
        ${
          collab.warning_count || collab.critical_count
            ? `<div class="banner ${collab.critical_count ? "err" : ""}">
                ${ico("alert")}
                <span><strong>协作诊断</strong> — ${collab.critical_count} 严重 · ${collab.warning_count} 警告</span>
              </div>`
            : ""
        }
        <section class="section-block">
          <div class="section-header">
            <div>
              <h2>协作诊断</h2>
              <p>collaboration_diagnostics · 责任链 / 阶段交接 / Git</p>
            </div>
            <button class="btn icon" type="button" data-action="refresh" data-tip="重新运行">${ico("refresh")}</button>
          </div>
          <div class="diagnostic-list">${diagRows(collab.findings)}</div>
        </section>

        <section class="section-block">
          <div class="section-header">
            <div>
              <h2>环境诊断</h2>
              <p class="mono" style="margin:3px 0 0;font-size:11px;color:rgb(var(--ink3))" title="${ws.database_path}">${ws.database_path}</p>
            </div>
            <button class="btn icon" type="button" data-action="refresh" data-tip="重新运行 doctor">${ico("refresh")}</button>
          </div>
          <div class="diagnostic-list">${diagRows(doctor.diagnostics)}</div>
        </section>

        <section class="section-block">
          <div class="section-header">
            <div>
              <h2>运行日志</h2>
              <p>logs_tail · 最近 JSONL</p>
            </div>
          </div>
          <div class="log-view">${logRows}</div>
        </section>
      </div>`;

    SB_SHELL.mountShell({
      activePage: "diagnostics",
      title: SB_MOCK.dashboard.details.task.title,
      eyebrow: "诊断",
      phase: "active",
      subtitle: "doctor · collaboration · logs",
      contentHtml: content,
    });
  </script>
</body>
</html>
