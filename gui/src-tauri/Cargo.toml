[package]
name = "sessionbridge-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "SessionBridge desktop operator console"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/GTJasonMK/sessionBridge"
repository = "https://github.com/GTJasonMK/sessionBridge"
publish = false

[lib]
name = "sessionbridge_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sessionbridge = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
toml = "0.9"
uuid = { version = "1.18", features = ["v7"] }
